<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@700&amp;display=block');
      .letra { font-family: 'Fredoka', 'Comic Sans MS', sans-serif; font-weight: 700; paint-order: stroke; stroke: #ffffff; stroke-width: 12; stroke-linejoin: round; }
    </style>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5FE3D6"/>
      <stop offset="1" stop-color="#14B3A6"/>
    </linearGradient>
    <linearGradient id="pantalla" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F1FFFD"/>
      <stop offset="1" stop-color="#BFF3EC"/>
    </linearGradient>
    <filter id="sombra" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#0B5D57" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="500" height="500" fill="url(#fondo)"/>
  <!-- laptop -->
  <g filter="url(#sombra)">
    <rect x="80" y="105" width="340" height="235" rx="32" fill="#FFFFFF"/>
    <rect x="98" y="123" width="304" height="199" rx="20" fill="url(#pantalla)"/>
    <path d="M45 350 h410 a10 10 0 0 1 9 14 l-12 26 a18 18 0 0 1 -16 10 H64 a18 18 0 0 1 -16 -10 l-12 -26 a10 10 0 0 1 9 -14z" fill="#FFFFFF"/>
  </g>
  <path d="M140 150 l6 12 13 2 -9 9 2 13 -12 -6 -12 6 2 -13 -9 -9 13 -2z" fill="#FFD23F"/>
  <circle cx="365" cy="150" r="9" fill="#FF8FB1"/>
  <circle cx="370" cy="290" r="7" fill="#7C9CFF"/>
  <g filter="url(#sombra)">
    <text class="letra" x="158" y="283" font-size="150" fill="#FF7A45" transform="rotate(-8 185 230)">S</text>
    <text class="letra" x="238" y="286" font-size="150" fill="#6C5CE7" transform="rotate(6 290 230)">m</text>
  </g>
  <path d="M195 305 q55 22 110 0" fill="none" stroke="#FF7A45" stroke-width="7" stroke-linecap="round"/>
</svg>
