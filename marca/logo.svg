<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 600" width="900" height="600">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&amp;display=block');
      .letra { font-family: 'Fredoka', 'Comic Sans MS', sans-serif; font-weight: 700; paint-order: stroke; stroke: #ffffff; stroke-width: 14; stroke-linejoin: round; }
      .frase { font-family: 'Fredoka', 'Comic Sans MS', sans-serif; font-weight: 600; }
    </style>
    <linearGradient id="marco" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5FE3D6"/>
      <stop offset="1" stop-color="#14B3A6"/>
    </linearGradient>
    <linearGradient id="pantalla" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F1FFFD"/>
      <stop offset="1" stop-color="#BFF3EC"/>
    </linearGradient>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7DEBE0"/>
      <stop offset="1" stop-color="#22BFB2"/>
    </linearGradient>
    <filter id="sombra" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#0B5D57" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Pantalla de la laptop -->
  <g filter="url(#sombra)">
    <rect x="150" y="30" width="600" height="410" rx="48" fill="url(#marco)"/>
    <rect x="182" y="62" width="536" height="346" rx="30" fill="url(#pantalla)"/>
    <!-- cámara -->
    <circle cx="450" cy="46" r="7" fill="#0E8C83"/>
  </g>

  <!-- Decoraciones -->
  <g>
    <path d="M250 120 l9 19 21 3 -15 15 4 21 -19 -10 -19 10 4 -21 -15 -15 21 -3z" fill="#FFD23F"/>
    <path d="M685 330 l7 14 15 2 -11 11 3 15 -14 -7 -14 7 3 -15 -11 -11 15 -2z" fill="#FFD23F"/>
    <circle cx="660" cy="118" r="13" fill="#FF8FB1"/>
    <circle cx="232" cy="330" r="11" fill="#7C9CFF"/>
    <circle cx="690" cy="170" r="7" fill="#7C9CFF"/>
    <circle cx="275" cy="370" r="6" fill="#FF8FB1"/>
    <path d="M610 92 q10 -14 20 0 q10 14 20 0" fill="none" stroke="#14B3A6" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Letras SM -->
  <g filter="url(#sombra)">
    <text class="letra" x="318" y="330" font-size="250" fill="#FF7A45" transform="rotate(-8 360 250)">S</text>
    <text class="letra" x="452" y="335" font-size="250" fill="#6C5CE7" transform="rotate(6 540 250)">m</text>
  </g>
  <!-- Sonrisa debajo de las letras -->
  <path d="M370 372 q80 34 160 0" fill="none" stroke="#FF7A45" stroke-width="10" stroke-linecap="round"/>

  <!-- Base de la laptop con la frase -->
  <g filter="url(#sombra)">
    <path d="M60 462 h780 a14 14 0 0 1 13 19 l-26 72 a24 24 0 0 1 -22 16 H95 a24 24 0 0 1 -22 -16 l-26 -72 a14 14 0 0 1 13 -19z" fill="url(#base)"/>
    <rect x="390" y="462" width="120" height="14" rx="7" fill="#0E8C83" opacity="0.35"/>
  </g>
  <text class="frase" x="450" y="538" font-size="44" text-anchor="middle" fill="#0B4F4A">Tu necesidad, <tspan fill="#5B3FD1">mi prioridad</tspan></text>
</svg>
